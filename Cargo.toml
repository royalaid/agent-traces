[package]
name = "agent-traces"
version = "0.2.1"
edition = "2024"
rust-version = "1.93"
description = "Read-only cross-harness coding-agent session discovery"
license = "MIT"
repository = "https://github.com/royalaid/agent-traces"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
walkdir = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

libc = "0.2"
